---
name: main build tagged-release

on:
  workflow_call:
  push:
    tags:
      - v*
  schedule:
    - cron: "0 6 1 * *" # Weekly build

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: write
  repository-projects: read
  security-events: read
  statuses: write

env:
  IMAGE_REPOSITORY: dev
  IMAGE_REGISTRY: gigatech
  PLATFORMS: linux/amd64,linux/arm64
  ARTIFACT_NAME: "vulnerability_rpt"
  RETENTION_DAYS: 1

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    outputs:
      current-version: ${{ steps.setup.outputs.current-version }}
      current-v-version: ${{ steps.setup.outputs.current-v-version }}
      version: ${{ steps.setup.outputs.version }}
      v-version: ${{ steps.setup.outputs.v-version }}
      pre-release-label: ${{ steps.setup.outputs.pre-release-label }}
      branch: ${{ steps.setup.outputs.branch }}
      NEEDS_REVIEW_LABEL: ${{ env.NEEDS_REVIEW_LABEL }}
    steps:
      - name: Setup GitHub token
        uses: GigaTech-net/public-reusable-workflows/.github/actions/setup-token@v1
        with:
          app_id: ${{ secrets.KEYROTATION_APPID_GT_GH }}
          private_key: ${{ secrets.KEYROTATION_PVTKEY_GT_GH }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Combined setup, checkout, version detection, and branch extraction
      - name: Setup workflow environment
        id: setup
        uses: >-
          GigaTech-net/public-reusable-workflows/.github/actions/setup-workflow@v1

      # Secret scan using composite action
      - name: Secret scan
        uses: >-
          GigaTech-net/public-reusable-workflows/.github/actions/secret-scan@v1

      # Spellcheck using composite action
      - name: Spellcheck
        uses: >-
          GigaTech-net/public-reusable-workflows/.github/actions/spellcheck@v1
        with:
          github_token: ${{ env.GITHUB_TOKEN }}
          filesToIgnore: "package-lock.json,./.vscode,./.github"

      # Super Linter using composite action
      - name: Super Linter
        uses: GigaTech-net/public-reusable-workflows/.github/actions/super-linter@v1
        with:
          github_token: ${{ env.GITHUB_TOKEN }}
          run_local: false

  build-deploy:
    name: Build and deploy
    needs: [quality-checks]
    environment: production
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        if: github.actor != 'dependabot[bot]'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }} # The base image name

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.actor != 'dependabot[bot]' }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger successful deployment event to DORA metrics webhook
        if: success()
        run: |
          # shellcheck disable=SC2086
          {
            DEPLOYMENT_RESPONSE=$(curl -X POST \
              -H "Authorization: token ${{ secrets.DORA_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              -d '{
                "ref": "${{ github.sha }}",
                "environment": "main",
                "required_contexts": [],
                "payload": "{ \"deploymentState\": \"success\" }",
                "description": "Successful deployment from ${{ github.repository }}"
              }' \
              https://api.github.com/repos/${{ github.repository }}/deployments)
            echo "DEPLOYMENT_ID=$(echo "$DEPLOYMENT_RESPONSE" | jq '.id')" >> $GITHUB_ENV
          }

      - name: Trigger failed deployment event to DORA metrics webhook
        if: failure()
        run: |
          # shellcheck disable=SC2086
          {
            DEPLOYMENT_RESPONSE=$(curl -X POST \
              -H "Authorization: token ${{ secrets.DORA_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              -d '{
                "ref": "${{ github.sha }}",
                "environment": "main",
                "required_contexts": [],
                "payload": "{ \"deploymentState\": \"failure\" }",
                "description": "Failed deployment from ${{ github.repository }}"
              }' \
              https://api.github.com/repos/${{ github.repository }}/deployments)
            echo "DEPLOYMENT_ID=$(echo "$DEPLOYMENT_RESPONSE" | jq '.id')" >> $GITHUB_ENV
          }
