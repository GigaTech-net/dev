---
name: Development PR open workflow

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - development

env:
  NEEDS_REVIEW_LABEL: "needs-human-review"
  ARTIFACT_NAME: "vulnerability_rpt"
  RETENTION_DAYS: 1

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: write
  repository-projects: read
  security-events: read
  statuses: write  

# cancel any previously-started, yet still active runs of this workflow on the same branch
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    outputs:
      current-version: ${{ steps.setup.outputs.current-version }}
      current-v-version: ${{ steps.setup.outputs.current-v-version }}
      version: ${{ steps.setup.outputs.version }}
      v-version: ${{ steps.setup.outputs.v-version }}
      pre-release-label: ${{ steps.setup.outputs.pre-release-label }}
      branch: ${{ steps.setup.outputs.branch }}
      NEEDS_REVIEW_LABEL: ${{ env.NEEDS_REVIEW_LABEL }}
    steps:
      - name: Setup GitHub token
        uses: GigaTech-net/public-reusable-workflows/.github/actions/setup-token@main
        with:
          app_id: ${{ secrets.KEYROTATION_APPID_GT_GH }}
          private_key: ${{ secrets.KEYROTATION_PVTKEY_GT_GH }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Combined setup, checkout, version detection, and branch extraction
      - name: Setup workflow environment
        id: setup
        uses: >-
          GigaTech-net/public-reusable-workflows/.github/actions/setup-workflow@main

      # Validate PR title using composite action
      - name: Validate PR title
        uses: >-
          GigaTech-net/public-reusable-workflows/.github/actions/validate-pr-title@main

      # Secret scan using composite action
      - name: Secret scan
        uses: >-
          GigaTech-net/public-reusable-workflows/.github/actions/secret-scan@main

      # Spellcheck using composite action
      - name: Spellcheck
        uses: >-
          GigaTech-net/public-reusable-workflows/.github/actions/spellcheck@main
        with:
          github_token: ${{ env.GITHUB_TOKEN }}
          filesToIgnore: 'package-lock.json,./.vscode,./.github'

      # Super Linter using composite action
      - name: Super Linter
        uses: GigaTech-net/public-reusable-workflows/.github/actions/super-linter@main
        with:
          github_token: ${{ env.GITHUB_TOKEN }}
          run_local: false

      - name: dependency check
        uses: GigaTech-net/public-reusable-workflows/.github/actions/dependency-check@main
        id: dependency-check
        with:
          artifact_name: ${{ env.ARTIFACT_NAME }}-${{ github.sha }}
          retention_days: ${{ env.RETENTION_DAYS }}
          working_directory: "."
          oss_index_user: ${{ secrets.SONATYPE_OSS_INDEX_USER }}
          oss_index_api_token: ${{ secrets.SONATYPE_OSS_INDEX_API_TOKEN }}

  complexity:
    name: Check Complexity
    needs: [quality-checks]
    uses: GigaTech-net/public-reusable-workflows/.github/workflows/rw-complexity.yaml@main
    with:
      needsReviewLabel: ${{ needs.quality-checks.outputs.NEEDS_REVIEW_LABEL }}
      tgtBranch: 'origin/development'
    secrets: inherit

  human-review:
    name: Check if human review is needed
    needs: [quality-checks, complexity]
    permissions: read-all
    uses: GigaTech-net/public-reusable-workflows/.github/workflows/rw-checkreview.yaml@main
    with:
      needsReviewLabel: ${{ needs.quality-checks.outputs.NEEDS_REVIEW_LABEL }}
    secrets: inherit

  enable-auto-merge:
    name: Enable Auto Merge
    needs: [quality-checks]
    runs-on: ubuntu-latest
    steps:
      - name: set to auto merge if human review is not needed (not dependabot)
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          {
            gh pr merge --auto --merge "$PR_URL"
          }
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GT_DEVSECOPS_PAT }}

      - name: set to auto merge if human review is not needed (dependabot)
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          {
            gh pr merge --auto --merge "$PR_URL"
          }
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auto-approve:
    name: Auto approve PR
    needs: [human-review, enable-auto-merge]
    runs-on: ubuntu-latest
    if: needs.human-review.outputs.human_review_needed == 'false'
    steps:  
      - name: Approve the PR if human review not needed
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
